name = "web-uicp"
main = "src/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "app.ui-color-palette.com", custom_domain = true }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
html_handling = "none"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
