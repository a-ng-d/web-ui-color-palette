name = "web-uicp"
main = "src/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "app.ui-color-palette.com", custom_domain = true }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
# Without this, the assets binding answers "/" with the raw index.html and the
# home page never reaches the worker, so it ships unrendered. "none" keeps the
# binding to exact file matches, which still covers the "/index.html" the
# worker fetches for its template.
html_handling = "none"

# `name` and `routes` are inherited from the top level unless redeclared, so
# both must be set explicitly here or `wrangler deploy --env staging` would
# deploy over the production Worker and fight it for app.ui-color-palette.com.
[env.staging]
name = "web-uicp-staging"
routes = [
  { pattern = "dev.ui-color-palette.com", custom_domain = true }
]
